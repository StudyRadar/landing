<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Under Construction</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Futuristic dark gradient background */
            background-color: #050505;
            background-image: radial-gradient(circle at center, #111827 0%, #000000 100%);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle grid background for the sci-fi feel */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            padding: 20px;
            width: 100%;
            max-width: 800px;
        }

        /* Responsive typography using clamp() */
        h1 {
            /* Scales between 2rem and 5rem based on screen width */
            font-size: clamp(2rem, 6vw, 5rem);
            font-weight: 900;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7), 0 0 20px rgba(0, 255, 255, 0.5), 0 0 40px rgba(0, 255, 255, 0.3);
            margin-bottom: 20px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .date {
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            font-weight: 700;
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.7), 0 0 20px rgba(255, 0, 255, 0.5);
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .stay-tuned {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: #a8b2d1;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: pulse 2s infinite ease-in-out;
        }

        /* Futuristic rotating loader */
        .loader {
            width: 60px;
            height: 60px;
            border: 3px solid transparent;
            border-top-color: #00ffff;
            border-bottom-color: #ff00ff;
            border-radius: 50%;
            margin: 50px auto 0;
            animation: spin 1.5s linear infinite;
            position: relative;
        }

        .loader::before {
            content: "";
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 3px solid transparent;
            border-left-color: #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite reverse;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 5px #a8b2d1; }
            50% { opacity: 0.3; text-shadow: none; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Under Construction</h1>
        <div class="date">Coming September 26</div>
        <div class="stay-tuned">Stay Tuned...</div>
        
        <div class="loader"></div>
    </div>

</body>
</html>
